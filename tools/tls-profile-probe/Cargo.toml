[workspace]

[package]
name = "tls-profile-probe"
version = "0.1.0"
edition = "2021"

[dependencies]
native-tls = { version = "0.2", features = ["vendored"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "default-tls", "native-tls-vendored", "rustls-tls", "http2", "socks"] }
rustls = { version = "0.23", features = ["ring"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-native-tls = "0.3"
url = "2"
webpki-roots = "0.26"
